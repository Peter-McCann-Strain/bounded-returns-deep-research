[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research"
version = "0.1.0"
description = "Controlled comparison of eleven deep-research orchestration architectures: pipelines, evaluation harness, and paper statistics"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Peter McCann Strain"}]
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "structlog>=24.1.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Model providers, retrieval, and content extraction: needed to RUN patterns.
api = [
    "openai>=2.24.0",
    "anthropic>=0.40.0",
    "aiohttp>=3.9.0",
    "aiolimiter>=1.1.0",
    "tavily-python>=0.5.0",
    "trafilatura>=1.12.0",
    "beautifulsoup4>=4.12.0",
    "arxiv>=2.1.0",
    "requests>=2.31.0",
]
# Statistics and figures: needed to RECOMPUTE the paper's numbers from data/analysis.
paper = [
    "numpy>=1.26.0",
    "pandas>=2.3.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.8.0",
    "scikit-posthocs>=0.11.0",
    "pyarrow>=15.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "statsmodels>=0.14.0",
    "pingouin>=0.5.4",
    "krippendorff>=0.6.1",
    "patsy>=0.5.6",
    "bibtexparser>=1.4.0",
]
# Local/GPU inference and RL training: needed for patterns P9-P17.
# Install a torch build matching your CUDA version first; see REPRODUCIBILITY.md.
local = [
    "torch>=2.4.0",
    "transformers>=4.44.0",
    "accelerate>=0.34.0",
    "bitsandbytes>=0.43.0",
    "peft>=0.13.0",
    "trl>=0.11.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.25.0",
]
dev = ["pytest>=9.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.8.0"]
# Everything except local/GPU, which needs a CUDA-matched torch build.
all = ["deep-research[api,paper,dev]"]

[project.scripts]
deep-research = "deep_research.cli:main"

[tool.setuptools.packages.find]
include = ["deep_research*"]
exclude = ["tests*", "scripts*", "papers*", "reports*", "artifacts*", "results*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    "venv",
    ".venv",
    ".cudatk",
    "artifacts",
    "results",
    "external_frameworks",
    "scratchpad*",
    "papers/paper_a_bounded_returns/submission_tmlr",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    "venv",
    ".venv",
    ".cudatk",
    "artifacts",
    "results",
    "external_frameworks",
    "scratchpad*",
]
